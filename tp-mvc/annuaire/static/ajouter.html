<!DOCTYPE html>
<html lang="fr">

  <head>
    <meta charset="utf-8">
    <link href="style.css" rel="stylesheet" />
    <title>Annuaire </title>
  </head>

  <body>
    <h1>Annuaire </h1>

    <h2>Ajouter</h2>

    <form action="add" method="post">
      <table>
        <tr>
          <td>Nom :</td>
          <td><input name="nom" /></td>
        </tr>
        <tr>
          <td>Prénom :</td>
          <td><input name="prenom" /></td>
        </tr>
        <tr>
          <td>Année :</td>
          <td><input name="annee" /></td>
        </tr>
        <tr>
          <td>Tel :</td>
          <td><input name="tel" /></td>
        </tr>
      </table>
      <input type="submit" value="Ajouter">
    </form>

  </body>

</html>
